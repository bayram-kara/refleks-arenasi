<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pıtır</title>
<meta name="theme-color" content="#ffd23f">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pıtır">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: a bright children's arcade, playful but tidy
   IDEA a pocket arcade cabinet with a pet who lives inside it and grows with every game
   PICTURE Pıtır, drawn from parts that change with level, form, mood and accessories; each game a drawn board
   COLOUR sun yellow marquee, warm paper ground, grape ink, one bright colour per game
   TYPE Baloo 2 display + Nunito text
   LAYOUT marquee with title left and Pıtır family right; cartridge grids; Pıtır's room as its own screen */
:root{--sun:#ffd23f;--bg:#fff3d6;--ink:#2a1d47;--soft:#6b5d85;--line:#2a1d4714;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Baloo 2',Nunito,sans-serif;line-height:1.05;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:disabled{cursor:default}
.btn{min-height:50px;padding:0 24px;border-radius:999px;background:var(--ink);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;box-shadow:0 5px 0 #00000040;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #00000040}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 5px 0 #2a1d4730;outline:2px solid #2a1d4718}
.btn:disabled{opacity:.45}
.top{background:var(--sun);position:relative;overflow:hidden;padding:22px max(5vw,16px) 0}
.spark{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.topin{position:relative;max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px}
.top h1{font-size:clamp(36px,7vw,64px);font-weight:800}
.hi{font-size:clamp(16px,2.4vw,20px);margin:8px 0 14px;font-weight:800;color:#6a4b00}
.pills{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:30px}
.pill{background:#fff;border-radius:999px;min-height:40px;padding:0 14px;font-weight:800;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 #0000001a;white-space:nowrap}
.pill svg{width:20px;height:20px}
.mbox{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end}
.hfam{display:flex;align-items:flex-end;cursor:pointer;margin-bottom:-4px}
.hfam .mascot{width:calc(clamp(110px,20vw,190px)*var(--k,1));display:block}
.hfam .hk{width:clamp(34px,6vw,54px);margin-left:-6px}
.bub{background:#fff;border-radius:16px;padding:8px 12px;font-weight:800;font-size:14px;line-height:1.3;max-width:220px;position:relative;box-shadow:0 3px 0 #0000001a;margin-bottom:6px;align-self:center}
.bub::after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff;transform:translateX(-50%)}
svg .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.breathe{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.jump{animation:jump .5s!important}
.wave{position:absolute;left:0;bottom:-1px;width:100%;height:34px}
main{max-width:1100px;margin:auto;padding:18px max(5vw,16px) 48px}
.daily{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;border-radius:22px;padding:14px 16px;margin-bottom:22px;flex-wrap:wrap}
.daily>svg{width:52px;height:52px;flex:none}
.daily .tx{flex:1 1 200px}
.daily b{font-family:'Baloo 2',sans-serif;font-size:21px;display:block;line-height:1.15}
.daily span{opacity:.8;font-size:15px}
.daily .btn{background:var(--sun);color:var(--ink);min-height:46px;font-size:17px}
.daily.done .btn{background:#ffffff26;color:#fff}
.sec{font-size:26px;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.gc{background:#fff;border-radius:22px;overflow:hidden;text-align:left;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;transition:transform .15s}
.gc:hover{transform:translateY(-3px)}
.art{background:var(--c);aspect-ratio:4/3;display:grid;place-items:center;position:relative;overflow:hidden}
.art::before{content:"";position:absolute;width:140%;height:60%;left:-20%;bottom:-38%;border-radius:50%;background:#0000001a}
.art svg{width:80%;height:auto;position:relative}
.meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.gc h3{font-size:clamp(18px,2.6vw,22px)}
.gc p{margin:0 0 6px;color:var(--soft);font-size:14px;line-height:1.35}
.sr{display:flex;align-items:center;gap:6px;margin-top:auto;flex-wrap:wrap}
.st{display:flex;gap:1px}
.st svg{width:20px;height:20px}
.best{font-size:13px;color:var(--soft);font-weight:800}
.new{position:absolute;top:10px;right:10px;background:#fff;color:var(--ink);font-weight:800;font-size:12px;border-radius:999px;padding:2px 9px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:26px}
@media(max-width:760px){.row2{grid-template-columns:minmax(0,1fr)}}
.panel{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 0 var(--line)}
.panel h2{font-size:24px}
.panel .note{margin:2px 0 14px;color:var(--soft);font-size:14px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.bd{text-align:center;font-size:13px;font-weight:800;line-height:1.25}
.bd svg{width:56px;height:56px;display:block;margin:0 auto 4px}
.bd.off{opacity:.4;filter:grayscale(1)}
.pc{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center;margin:10px 0 14px}
.pc svg{width:120px;display:block}
.pc b{font-family:'Baloo 2',sans-serif;font-size:19px;display:block;line-height:1.2}
.stat{display:grid;grid-template-columns:5.6em minmax(0,1fr) 3em;gap:8px;align-items:center;font-weight:800;font-size:14px;margin-top:6px}
.stat span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.meter{height:12px;background:#2a1d4714;border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;background:var(--c)}
/* game + pet screens */
#game,#pet{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5;user-select:none;-webkit-user-select:none}
#game.show,#pet.show{display:flex}
#pet{overflow:auto;z-index:6}
.hud{background:var(--gc);color:#fff;padding:10px max(4vw,12px);display:flex;align-items:center;gap:8px;flex:none}
.hud h2{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{min-height:44px;padding:0 14px;border-radius:999px;background:#ffffff33;color:#fff;font-weight:800;white-space:nowrap}
.hp{background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}
.hp:empty{display:none}
.bar{height:9px;background:#2a1d4712;flex:none}
.bar i{display:block;height:100%;width:100%;background:var(--gc);transition:width .1s linear}
.bar.low i{background:#ef4444}
#stage{flex:1;overflow:auto;display:grid;place-items:center;padding:16px;position:relative}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:#2a1d4788;padding:16px;z-index:3;overflow:auto}
.ov.calm{background:transparent}
.box{background:#fff;border-radius:28px;padding:24px 22px;width:min(100%,400px);text-align:center;box-shadow:0 10px 0 #0000001f;position:relative;z-index:2}
.box .ico{background:var(--gc);border-radius:20px;margin:-6px -4px 14px;padding:10px}
.box .ico svg{width:min(70%,220px);height:auto;display:block;margin:auto}
.box h2{font-size:32px}
.box p{margin:8px 0;color:var(--soft)}
.box .btn{margin-top:8px}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.bigst{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.bigst span{width:58px;height:58px;transform:scale(0);animation:sin .45s cubic-bezier(.3,1.6,.5,1) forwards}
.bigst span:nth-child(2){width:70px;height:70px;margin-top:-10px}
.bigst svg{width:100%;height:100%}
.val{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;line-height:1}
.val small{font-size:22px;color:var(--soft)}
.tag{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;margin:3px 2px}
.tag.y{background:#fff1c2;color:#7a5600}
.tag.p{background:#f3e8ff;color:#6b21a8}
.pev{display:flex;align-items:center;gap:10px;text-align:left;background:#faf5ff;border-radius:18px;padding:8px 10px;margin-top:10px}
.pev svg{width:64px;flex:none}
.cf{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall 1.8s ease-in forwards}
.hint{margin:0;font-weight:800;font-size:18px}
/* kart */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(100%,440px)}
.mc{aspect-ratio:3/4;perspective:700px}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.up .in{transform:rotateY(180deg)}
.bk,.fr{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.bk{background:radial-gradient(circle,#ffffff40 22%,transparent 25%) 0 0/14px 14px,#ff5d5d;box-shadow:inset 0 0 0 4px #ffffff70,0 4px 0 #00000022}
.bk::after{content:"★";color:#fff;font-size:clamp(22px,6vw,34px);text-shadow:0 2px 0 #0002}
.fr{background:#fff;transform:rotateY(180deg);font-size:clamp(30px,9vw,46px);box-shadow:0 4px 0 #00000022}
.mc.ok .fr{background:#dcfce7;animation:pop .4s}
/* renk */
.rk{width:min(100%,460px);display:grid;gap:14px;text-align:center}
.word{background:var(--ink);border-radius:26px;height:clamp(140px,30vh,200px);display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(46px,13vw,76px);box-shadow:0 6px 0 #0000002a}
.word.bad,.fk.bad,.num.bad,.gq.bad{animation:shake .3s}
.word.good{animation:pop .25s}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{height:74px;border-radius:20px;background:var(--c);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:21px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 65%,#000)}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 65%,#000)}
/* kostebek */
.kb{width:min(100%,480px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:radial-gradient(circle,#ffffff22 2px,transparent 3px) 0 0/22px 22px,#6cc05a;border-radius:28px;padding:14px;box-shadow:inset 0 -10px 0 #00000018,0 6px 0 #00000018}
.kb.boom{animation:shake .35s;background-color:#e0705a}
.hole{position:relative;aspect-ratio:1;touch-action:manipulation}
.pit{position:absolute;left:10%;right:10%;bottom:14%;height:26%;background:#3b2414;border-radius:50%}
.mw{position:absolute;left:14%;right:14%;bottom:27%;top:0;overflow:hidden}
.cr{position:absolute;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .13s ease-out}
.cr svg{display:block;width:100%}
.hole.up .cr{transform:translateY(6%)}
.hole.hit .cr{transform:translateY(30%) scaleY(.85)}
.lip{position:absolute;left:4%;right:4%;bottom:5%;height:24%;background:#9a6538;border-radius:50%;box-shadow:inset 0 -6px 0 #00000026}
.fl{position:absolute;left:50%;top:20%;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;color:#fff;text-shadow:0 2px 0 #0005;animation:up .7s forwards;pointer-events:none;z-index:4}
/* simon */
.sm{width:min(100%,400px,62vh);aspect-ratio:1;position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;background:var(--ink);border-radius:50%;box-shadow:0 8px 0 #00000030}
.pad{opacity:.5;transition:opacity .08s,filter .08s,transform .08s}
.pad.lit{opacity:1;filter:brightness(1.2) saturate(1.2);transform:scale(.97)}
.pad:nth-child(1){border-radius:100% 0 0 0;background:#22c55e}
.pad:nth-child(2){border-radius:0 100% 0 0;background:#ef4444}
.pad:nth-child(3){border-radius:0 0 0 100%;background:#facc15}
.pad:nth-child(4){border-radius:0 0 100% 0;background:#3b82f6}
.hub{position:absolute;inset:31%;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;pointer-events:none;box-shadow:inset 0 0 0 6px #ffffff14}
.hn{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(34px,9vw,52px);line-height:1}
.hs{font-weight:800;font-size:14px;opacity:.85}
/* sayi */
.nb{width:min(100%,440px);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.num{aspect-ratio:1;border-radius:50%;background:var(--c);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(24px,7vw,36px);transform:scale(var(--s)) rotate(var(--r));box-shadow:inset 0 -6px 0 #00000026,inset 0 5px 0 #ffffff40,0 4px 0 #00000022;transition:transform .2s,opacity .2s}
.num.done{transform:scale(0);opacity:0;pointer-events:none}
/* fark */
.fk{width:min(100%,440px,64vh);display:grid;gap:6px}
.tile{aspect-ratio:1;border-radius:24%;background:var(--c);box-shadow:inset 0 -5px 0 #00000022,inset 0 4px 0 #ffffff30}
/* balon */
.bl{width:min(100%,480px);display:grid;gap:10px}
.tgt{background:#fff;border-radius:18px;padding:10px 14px;text-align:center;font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--line)}
.tgt b{font-family:'Baloo 2',sans-serif;font-size:22px;-webkit-text-stroke:.5px #2a1d4760}
.tgt.good{animation:pop .3s}
.sky{position:relative;height:min(60vh,520px);border-radius:26px;overflow:hidden;background:linear-gradient(#7cc8ff,#d8f1ff);box-shadow:0 6px 0 #0000001a}
.sky::before,.sky::after{content:"";position:absolute;background:#fff;border-radius:999px;opacity:.8}
.sky::before{width:120px;height:34px;top:18%;left:8%;box-shadow:40px -14px 0 4px #fff}
.sky::after{width:100px;height:28px;top:52%;right:6%;box-shadow:-34px -12px 0 2px #fff}
.bal{position:absolute;top:100%;width:clamp(56px,15vw,74px);animation:rise var(--d) linear forwards;z-index:1}
.bal svg{display:block;width:100%}
.bal.pp{animation:none;transform:scale(1.4);opacity:0;transition:transform .2s,opacity .2s}
/* tepki */
.rx{width:min(100%,460px);height:min(54vh,420px);border-radius:30px;display:grid;place-content:center;gap:6px;color:#fff;text-align:center;box-shadow:0 8px 0 #0000002a;background:var(--ink)}
.rx.wait{background:#ef4444}.rx.go{background:#22c55e}.rx.early{background:#f59e0b}
.rt{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(40px,11vw,64px);line-height:1}
.rs{font-weight:800;opacity:.9}
.tries{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tries span{background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--line)}
/* canvas games */
.cvs{display:block;width:min(100%,480px);height:min(68vh,640px);border-radius:26px;touch-action:none;box-shadow:0 6px 0 #0000001a}
.cvs.wood{background:repeating-linear-gradient(90deg,#8a5530 0 46px,#7a4a28 46px 50px,#94603a 50px 96px,#7a4a28 96px 100px)}
.full{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
/* golge */
.gg{width:min(100%,460px);display:grid;gap:12px;text-align:center}
.gq{background:#fff;border-radius:26px;height:min(28vh,220px);display:grid;place-items:center;font-size:min(20vh,140px);line-height:1;box-shadow:0 6px 0 var(--line)}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gopt{height:min(17vh,130px);background:#dfe9f5;border-radius:20px;font-size:min(12vh,84px);line-height:1;display:grid;place-items:center;box-shadow:0 5px 0 var(--line)}
.gopt span{filter:brightness(0);opacity:.88;display:inline-block;transform:var(--t)}
/* labirent */
.lb{width:min(100%,460px,62vh);display:grid;gap:10px;text-align:center}
#mz{width:100%;aspect-ratio:1;touch-action:none;background:#fff;border-radius:22px;box-shadow:0 6px 0 var(--line);display:block}
/* iki kisilik */
.duo{position:absolute;inset:0;display:flex;flex-direction:column}
.duo.dk{background:var(--ink)}
.half{flex:1 1 0;display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden;touch-action:manipulation;transition:flex-grow .1s,filter .15s;min-height:0;padding:8px}
.half.p2{transform:rotate(180deg);background:#3b82f6}
.half.p1{background:#ff5d5d}
.half.win{filter:brightness(1.12)}
.half.lk{filter:grayscale(.7) brightness(.8)}
.nm{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;opacity:.9}
.big{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(44px,12vw,84px);line-height:1}
.sm2{font-weight:800;opacity:.9}
.rope{flex:none;height:16px;background:repeating-linear-gradient(60deg,#d6a46a 0 8px,#9a6538 8px 16px);position:relative;z-index:2;box-shadow:0 0 0 3px var(--ink)}
.rope i{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;background:var(--sun);border:5px solid var(--ink)}
.mid2{flex:none;height:96px;display:grid;place-items:center;background:var(--ink)}
.lamp{width:70px;height:70px;border-radius:50%;background:#4b3f63;box-shadow:inset 0 -6px 0 #0003;transition:background .05s}
.lamp.y{background:#facc15;box-shadow:0 0 30px #facc15}
.lamp.g{background:#22c55e;box-shadow:0 0 40px #22c55e}
.mid3{flex:none;background:var(--ink);display:grid;grid-template-rows:1fr 1fr;height:140px}
.cw{display:grid;place-items:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(34px,10vw,48px);line-height:1}
.cw.flip{transform:rotate(180deg)}
.cb{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(86vw,380px);margin-top:8px}
.cb button{height:clamp(48px,8vh,64px);border-radius:16px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;box-shadow:0 0 0 3px #fff,0 5px 0 3px #00000030}
.xb{flex:none;align-self:center;width:min(86vw,42vh,400px);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;padding:8px;margin:6px 0}
.xc{background:#fff;border-radius:14px;display:grid;place-items:center;min-height:0;overflow:hidden}
.xc svg{width:72%;height:72%;animation:sin .2s forwards;transform:scale(0)}
.xc.w{background:#fff1c2}
.xo .big{font-size:clamp(28px,8vw,44px)}
.tb{height:8px;background:#ffffff40;border-radius:9px;width:180px;margin:8px auto 0;overflow:hidden}
.tb i{display:block;height:100%;background:#fff;width:0}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;text-align:left}
.names label{font-size:13px;font-weight:800;color:var(--soft)}
.names input,.kid input{display:block;width:100%;min-height:44px;font:800 16px Nunito,sans-serif;border:2px solid #2a1d4730;border-radius:12px;padding:0 10px;margin-top:4px;color:var(--ink);background:#fff}
.names input:focus,.kid input:focus{outline:3px solid var(--sun);border-color:var(--ink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* pet room */
.room{position:relative;height:clamp(300px,46vh,440px);flex:none;overflow:hidden}
.room>svg.bgs{position:absolute;inset:0;width:100%;height:100%}
.fam{position:absolute;left:0;right:0;bottom:5%;display:flex;justify-content:center;align-items:flex-end;gap:1%;padding:0 8px}
.pz{position:relative;cursor:pointer}
.pz svg{display:block;width:100%}
.pz.main{width:calc(clamp(150px,34vw,230px)*var(--k,1))}
.pz.kd{width:calc(clamp(72px,16vw,110px)*var(--k,1))}
.pz.egg{width:clamp(50px,10vw,72px);cursor:default}
.room .bub{position:absolute;top:5%;left:50%;transform:translateX(-50%);max-width:min(80%,320px);font-size:16px;margin:0;text-align:center}
.hrt{position:absolute;left:50%;top:30%;color:#ff4f8b;font-size:28px;font-weight:800;animation:up .9s forwards;pointer-events:none;z-index:4;text-shadow:0 2px 0 #fff}
.pbody{max-width:760px;width:100%;margin:0 auto;padding:16px max(4vw,14px) 40px;display:grid;gap:14px}
.lvl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lvl h2{font-size:28px}
.lvl span{color:var(--soft);font-weight:800}
.acts2{display:flex;gap:10px;flex-wrap:wrap}
.acts2 .btn{flex:1 1 140px}
.tabs{display:flex;gap:6px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 4px 0 var(--line)}
.tabs button{flex:1;min-height:44px;border-radius:999px;font-weight:800}
.tabs .on{background:var(--ink);color:#fff}
.accs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.acc{background:#fff;border-radius:18px;padding:10px 6px;text-align:center;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--line);line-height:1.25}
.acc svg{width:76px;height:56px;display:block;margin:0 auto 4px}
.acc small{display:block;color:var(--soft);font-size:13px}
.acc.on{outline:3px solid var(--ink)}
.acc.no{opacity:.55}
.cols{display:flex;flex-wrap:wrap;gap:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:800;width:62px}
.sw i{width:54px;height:54px;border-radius:50%;background:var(--c);border:4px solid #fff;box-shadow:0 0 0 2px #2a1d4722;display:grid;place-items:center;font-style:normal;color:var(--soft);font-size:13px}
.sw.on i{box-shadow:0 0 0 3px var(--ink)}
.sw.lock i{background:#eee6d6}
.sw.lock{color:var(--soft)}
.kid{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--line);margin-bottom:10px}
.kid svg{width:64px;display:block}
.kid small{color:var(--soft);font-weight:800}
.tip{background:#fff;border-radius:18px;padding:14px;color:var(--soft);font-weight:700;box-shadow:0 4px 0 var(--line)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes breathe{50%{transform:scale(1.02,.975)}}
@keyframes jump{40%{transform:translateY(-22px)}}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes sin{to{transform:scale(1)}}
@keyframes up{from{transform:translate(-50%,0)}to{transform:translate(-50%,-70px);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@keyframes rise{from{top:100%}to{top:-40%}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media(max-width:600px){.top{padding-top:16px}.pills{padding-bottom:24px}.panel{padding:16px}.hfam .hk:nth-child(n+4){display:none}.bub{max-width:150px;font-size:13px}.accs{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

function mood(){const P=D.pet,hr=new Date().getHours();if(Date.now()-(P.party||0)<180000)return 'excited';if(P.food<30)return 'hungry';if(hr>=22||hr<7)return 'sleepy';if(P.joy<30)return 'sad';return 'happy'}
const LINES={happy:['Bugün hangi rekoru kıralım?','Seninle oynamak çok güzel!','Bir oyun daha? Lütfen!','Yıldız toplamaya bayılıyorum.','Beni sevmek için bana dokun!'],

function grant(id,stars,duo){
 const P=D.pet;tick();
 const b={lv:lvOf(P.xp)},bst=stOf(b.lv);
 const xp=duo?15:10+stars*10,happy=P.food>50&&P.joy>50,coin=(duo?3:2+stars*2)+(happy?1:0);
 P.xp+=xp;P.coins+=coin;P.joy=clamp(P.joy+5);P.food=clamp(P.food-3);
 const cat=duo?'neseli':CAT[id];P.cat[cat]=(P.cat[cat]||0)+xp;
 const ev=[`+${xp} XP`,`+${coin} yıldız tozu${happy?' (mutlu bonusu)':''}`];
 P.kids.forEach(k=>{const s0=kidSt(k.xp);k.xp+=6;const s1=kidSt(k.xp);if(s1>s0){if(s1===2&&!k.form)k.form=pick(Object.keys(FORMS));ev.push(`${k.name} büyüdü: ${KIDST[Math.min(3,s1)]}!`)}});
 const l=lvOf(P.xp),st=stOf(l);
 if(l>b.lv)ev.push(`Pıtır ${l}. seviyeye çıktı!`);
 if(st>bst)ev.push(`Pıtır büyüdü: artık ${STAGES[st].name}!`);
 if(st>=2&&!P.form){P.form=Object.entries(P.cat).sort((x,y)=>y[1]-x[1])[0][0];ev.push(`Pıtır ${FORMS[P.form].name} Pıtır'a dönüştü!`)}
 if(P.egg){P.egg.n++;if(P.egg.n>=5){const used=P.kids.map(k=>k.name),nm=KIDNAMES.find(n=>!used.includes(n))||'Minik',k={name:nm,c:KIDCOLS[P.kids.length%KIDCOLS.length],xp:0,form:null};P.kids.push(k);P.egg=null;P.party=Date.now();ev.push(`Yumurta çatladı! ${nm} aileye katıldı!`)}}
 else if(P.kids.length<4&&EGGS.filter(x=>l>=x).length>P.eggs){P.egg={n:0};P.eggs++;ev.push('Pıtır\'ın bir yumurtası oldu! 5 oyun sonra çatlayacak.')}
 return ev;
}

 const sw=t.closest('[data-col]');if(sw&&!sw.disabled){D.color=+sw.dataset.col;save();renderPet();return}
 const tb=t.closest('[data-tab]');if(tb){petTab=tb.dataset.tab;renderPet();return}
 const ac2=t.closest('[data-acc]');if(ac2){const P=D.pet,a=ACCS.find(x=>x.id===ac2.dataset.acc);
  if(P.wear===a.id)P.wear=null;else if(P.acc.includes(a.id))P.wear=a.id;else if(P.coins>=a.cost){P.coins-=a.cost;P.acc.push(a.id);P.wear=a.id;tone(880,.15,'triangle',.12)}else{say(`Bunun için ${a.cost-P.coins} tozu daha lazım. Oyun oynayıp toplayalım!`);return}
  save();renderPet();say(P.wear?'Nasıl olmuşum?':'Böyle de güzelim!');return}
 const kt=t.closest('[data-kidtap]');if(kt){const k=D.pet.kids[+kt.dataset.kidtap];bounce(kt);hearts(kt);tone(1000,.08,'triangle',.1);say(`Ben ${k.name}! ${pick(['Abla, oyun oynayalım!','Ben de büyüyeceğim!','Pıtır en iyi arkadaşım!'])}`);return}
 if(t.closest('#snd')){D.sound=!D.sound;save();unlockAudio();renderHome();return}
 if(t.closest('#masc')||t.closest('#openpet')){openPet();return}
 if(t.closest('#pback')){closePet();return}
 if(t.closest('#feed')){feed();return}
 if(t.closest('#petit')||t.closest('#pmain')){petIt();return}
 if(t.closest('#go')||t.closest('#again')){begin();return}
 if(t.closest('#menu')||t.closest('#back')){closeGame();return}
});
document.addEventListener('change',e=>{const i=e.target.dataset&&e.target.dataset.kid;if(i==null)return;const v=e.target.value.trim();if(v){D.pet.kids[+i].name=v;save();renderPet()}});
setInterval(()=>{tick();save();if($('#pet').classList.contains('show'))renderPet();else if(!$('#game').classList.contains('show'))renderHome()},120000);
window.claude?.hot?.snapshot?.(()=>D);
const boot=init=>{load(init);renderHome()};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
}
</script>
<script>if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
